{% set name = "casa_formats_io" %}
{% set version = "0.3.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9b71132c4f3c3ee6e6fc0eaa1138ec14940197c364cdc267fa248fbccbf1a069

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - pip
    - python
    - numpy {{ numpy }}  # [py<39]
    - numpy >=2.0.0  # [py>=39]
    - setuptools
    - setuptools_scm
  run:
    - python
    - astropy >=4.0
    - numpy >=1.21
    - dask >=2.0

test:
  imports:
    - casa_formats_io
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest --pyargs casa_formats_io.tests

about:
  home: https://casa-formats-io.readthedocs.org
  license: LGPL-2.0-only
  license_family: LGPL
  license_file: LICENSE
  summary: Dask-based reader for CASA data
  description: A small package implementing I/O for CASA data formats
  doc_url: https://casa-formats-io.readthedocs.org
  dev_url: https://github.com/radio-astro-tools/casa-formats-io

extra:
  recipe-maintainers:
    - keflavich
    - mwcraig
    - astrofrog
  skip-lints:
    - host_section_needs_exact_pinnings
